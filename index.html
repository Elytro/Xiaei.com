<html lang="zh-CN">
<head>

    <meta name="description" content="校内网(www.xiaei.com)是一个真实的大学生互动社交网络, 找到老同学, 结识新朋友, 联络你和你周围的朋友。提供互动娱乐及生活服务, 是国内最专业的大学生互动娱乐平台网站之一。其服务内容包括大学生互动交友、校园生活资讯、网络购物、游戏娱乐、求职招聘及企业校园推广等, 定位为大学生综合性服务平台。">

    <meta property="og:description" content="校内网(www.xiaei.com)是一个真实的大学生互动社交网络, 找到老同学, 结识新朋友, 联络你和你周围的朋友。提供互动娱乐及生活服务, 是国内最专业的大学生互动娱乐平台网站之一。其服务内容包括大学生互动交友、校园生活资讯、网络购物、游戏娱乐、求职招聘及企业校园推广等, 定位为大学生综合性服务平台。">
    <meta property="og:site_name" content="校内网 - 大学生互动社区">
    <link href="https://apps.bdimg.com/libs/bootstrap/3.3.4/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://apps.bdimg.com/libs/fontawesome/4.4.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://apps.alyjs.com/traffic/d89e4d93fa1f6ac87b898cf5e2d284d2.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #fff;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      color: #444;
    }

    /* ── 顶部红蓝渐变条 ── */
    .top-bar {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #e74c3c 0%, #c0392b 30%, #3498db 70%, #2980b9 100%);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
    }

    /* ── 主体 ── */
    .login-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 16px 80px;
    }

    /* ── 品牌区 ── */
    .brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .brand .mark {
      display: inline-block;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #e74c3c 0%, #3498db 100%);
      line-height: 48px;
      margin-bottom: 10px;
      box-shadow: 0 4px 12px rgba(231, 76, 60, 0.18);
    }

    .brand .mark i {
      font-size: 24px;
      color: #fff;
    }

    .brand h2 {
      font-size: 18px;
      font-weight: 400;
      color: #333;
      letter-spacing: 2px;
      margin: 0;
    }

    .brand h2 b {
      background: linear-gradient(135deg, #e74c3c, #3498db);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── 登录卡片 ── */
    .login-card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 8px;
      border: 1px solid #f0f0f0;
      overflow: hidden;
    }

    /* ── Tab 切换 ── */
    .tab-header {
      display: flex;
      border-bottom: 1px solid #f0f0f0;
    }

    .tab-header .tab {
      flex: 1;
      text-align: center;
      padding: 14px 0;
      font-size: 14px;
      color: #aaa;
      cursor: pointer;
      transition: color 0.2s;
      position: relative;
      background: #fafafa;
    }

    .tab-header .tab.active {
      color: #333;
      background: #fff;
      font-weight: 500;
    }

    .tab-header .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 2px;
      background: linear-gradient(90deg, #e74c3c, #3498db);
      border-radius: 1px;
    }

    /* ── 表单区 ── */
    .tab-body {
      padding: 32px 30px 28px;
    }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #bbb;
      margin-bottom: 4px;
      font-weight: 400;
    }

    .form-control {
      height: 42px;
      border: 1px solid #e8e8e8;
      border-radius: 4px;
      box-shadow: none;
      font-size: 14px;
      color: #333;
      transition: border 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      border-color: #8eb4e3;
      box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.08);
    }

    .input-group .form-control {
      border-right: none;
    }

    .input-group .input-group-addon {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-left: none;
      border-radius: 0 4px 4px 0;
      color: #ccc;
    }

    /* ── 登录按钮 ── */
    .btn-login {
      display: block;
      width: 100%;
      height: 42px;
      border: none;
      border-radius: 4px;
      background: linear-gradient(90deg, #e74c3c 0%, #c0392b 35%, #3498db 70%, #2980b9 100%);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 4px;
      margin-top: 4px;
      transition: opacity 0.2s, box-shadow 0.2s;
    }

    .btn-login:hover,
    .btn-login:focus {
      color: #fff;
      opacity: 0.92;
      box-shadow: 0 4px 16px rgba(231, 76, 60, 0.25);
      outline: none;
    }

    .btn-login:active {
      opacity: 0.85;
    }

    /* ── 辅助链接 ── */
    .extra-links {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      font-size: 12px;
    }

    .extra-links a {
      color: #bbb;
      text-decoration: none;
    }

    .extra-links a:hover {
      color: #3498db;
      text-decoration: none;
    }

    /* ── 扫码区 ── */
    .qr-section {
      text-align: center;
    }

    .qr-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 140px;
      height: 140px;
      margin: 0 auto 12px;
      border: 1px solid #eee;
      border-radius: 6px;
      background: #fafafa;
      position: relative;
      overflow: hidden;
    }

    .qr-box i {
      font-size: 64px;
      color: #e0e0e0;
    }

    .qr-box .qr-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.75);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #aaa;
    }

    .qr-section .qr-tip {
      font-size: 13px;
      color: #bbb;
      margin-bottom: 16px;
    }

    .qr-section .btn-refresh {
      display: inline-block;
      padding: 6px 24px;
      border: 1px solid #e0e0e0;
      border-radius: 20px;
      font-size: 12px;
      color: #999;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }

    .qr-section .btn-refresh:hover {
      border-color: #3498db;
      color: #3498db;
    }

    /* ── 底部备案 ── */
    .footer-icp {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      text-align: center;
      padding: 14px 10px;
      font-size: 12px;
      color: #c8c8c8;
      background: #fff;
    }

    .footer-icp a {
      color: #c8c8c8;
      text-decoration: none;
    }

    .footer-icp a:hover {
      color: #999;
    }

    /* ── 响应式 ── */
    @media (max-width: 480px) {
      .login-card {
        border: none;
        border-radius: 0;
      }

      .tab-body {
        padding: 24px 18px 20px;
      }

      .brand h2 {
        font-size: 16px;
      }

      .qr-box {
        width: 120px;
        height: 120px;
      }

      .qr-box i {
        font-size: 48px;
      }
    }
  </style>
</head>
<body>

<div class="top-bar"></div>

<div class="login-wrapper">

  <!-- 品牌 -->
  <div class="brand">
    <div class="mark">
      <i class="fa fa-graduation-cap"></i>
    </div>
    <h2><b>校内网</b>&nbsp;·&nbsp;会员管理系统</h2>
  </div>

  <!-- 卡片 -->
  <div class="login-card">

    <!-- Tab 切换 -->
    <div class="tab-header">
      <div class="tab active" data-tab="pwd">密码登录</div>
      <div class="tab" data-tab="qr">扫码登录</div>
    </div>

    <div class="tab-body">

      <!-- 密码登录 -->
      <div class="tab-pane active" id="pane-pwd">
        <form>
          <div class="form-group">
            <label>学号 / 工号</label>
            <input type="text" class="form-control" placeholder="请输入学号或工号">
          </div>

          <div class="form-group">
            <label>密码</label>
            <div class="input-group">
              <input type="password" class="form-control" id="password" placeholder="请输入密码">
              <span class="input-group-addon" style="cursor:pointer;" id="togglePwd">
                <i class="fa fa-eye-slash"></i>
              </span>
            </div>
          </div>

          <button type="submit" class="btn btn-login">登&nbsp;&nbsp;录</button>
        </form>

        <div class="extra-links">
          <a href="#">首次登录激活</a>
          <a href="#">忘记密码</a>
        </div>
      </div>

      <!-- 扫码登录 -->
      <div class="tab-pane" id="pane-qr">
        <div class="qr-section">
          <div class="qr-box">
            <i class="fa fa-qrcode"></i>
            <div class="qr-overlay" id="qrExpire" style="display:none;">
              二维码已过期<br>请点击刷新
            </div>
          </div>
          <p class="qr-tip">请使用企业微信扫描二维码</p>
          <span class="btn-refresh" id="btnRefresh">
            <i class="fa fa-refresh"></i>&nbsp;刷新二维码
          </span>
        </div>
      </div>

    </div>
  </div>

</div>

<!-- ICP -->
<footer class="footer-icp">
  <a href="https://beian.miit.gov.cn/" target="_blank" rel="nofollow">鲁ICP备2025189343号-4</a>
</footer>

<script src="https://apps.bdimg.com/libs/jquery/2.1.4/jquery.min.js"></script>
<script src="https://apps.bdimg.com/libs/bootstrap/3.3.4/js/bootstrap.min.js"></script>
<script>
  // Tab 切换
  $('.tab-header .tab').on('click', function() {
    var target = $(this).data('tab');
    $('.tab-header .tab').removeClass('active');
    $(this).addClass('active');
    $('.tab-pane').removeClass('active');
    $('#pane-' + target).addClass('active');
  });

  // 密码显隐
  $('#togglePwd').on('click', function() {
    var $pwd = $('#password');
    var $icon = $(this).find('i');
    if ($pwd.attr('type') === 'password') {
      $pwd.attr('type', 'text');
      $icon.removeClass('fa-eye-slash').addClass('fa-eye');
    } else {
      $pwd.attr('type', 'password');
      $icon.removeClass('fa-eye').addClass('fa-eye-slash');
    }
  });

  // 模拟二维码过期
  $('#btnRefresh').on('click', function() {
    var $overlay = $('#qrExpire');
    $overlay.fadeIn(200).delay(800).fadeOut(200);
  });
</script>

</body>
</html>
